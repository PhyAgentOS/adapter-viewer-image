name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.97.1"
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libvulkan1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Validate package
        run: cargo package --locked

  security:
    name: RustSec audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0041

  image-chain:
    name: Headless Forge image chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out reviewed Gateway test dependency
        uses: actions/checkout@v5
        with:
          repository: PhyAgentOS/adapter-forge-gateway
          ref: c02ac097a636de9a2bc2b4656962aa11c610dbb9
          path: .test-gateway
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - name: Install frozen Gateway test environment
        run: uv sync --project .test-gateway --frozen --no-dev
      - name: Install pinned image fixture dependencies
        working-directory: examples/forge2_image_chain
        run: python -m pip install -r requirements.txt
      - name: Check frame validation
        working-directory: examples/forge2_image_chain
        run: python -m pytest test_image_stream.py test_run_chain.py -q
      - name: Run real Dora image transport
        working-directory: examples/forge2_image_chain
        run: |
          python run_chain.py --gateway-root ../../.test-gateway --output ../../build/gateway-chain
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewer-gateway-chain
          path: build/gateway-chain/
